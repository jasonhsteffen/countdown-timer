<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: transparent;
        }

        .timer-container {
            background: white;
            padding: 15px 25px;
            border-radius: 5px;
            border: 1px solid #ddd;
            text-align: center;
        }

        .timer-display {
            font-family: 'Courier New', monospace;
            font-size: 32px;
            font-weight: bold;
            color: #000;
            letter-spacing: 1px;
        }

        @media (max-width: 600px) {
            .timer-container {
                padding: 12px 20px;
            }

            .timer-display {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <div class="timer-container">
        <div class="timer-display" id="timer">00:00:00:00.0</div>
    </div>

    <script>
        // ============================================
        // CONFIGURATION - EDIT THESE VALUES
        // ============================================
        
        // Set your target date and time here
        // Format: new Date('YYYY-MM-DD HH:mm:ss')
        const targetDate = new Date('2025-12-31 23:59:59');
        
        // Optional: Set a timezone (e.g., 'America/New_York', 'Europe/London')
        // Leave empty string for user's local timezone
        const timezone = '';

        // ============================================
        // COUNTDOWN LOGIC
        // ============================================

        function updateTimer() {
            const now = new Date();
            const difference = targetDate - now;

            if (difference <= 0) {
                // Timer expired
                document.getElementById('timer').textContent = '00:00:00:00.0';
                return;
            }

            // Calculate time units
            const totalSeconds = Math.floor(difference / 1000);
            const days = Math.floor(totalSeconds / (60 * 60 * 24));
            const hours = Math.floor((totalSeconds % (60 * 60 * 24)) / (60 * 60));
            const minutes = Math.floor((totalSeconds % (60 * 60)) / 60);
            const seconds = totalSeconds % 60;
            
            // Calculate tenths (one decimal place)
            const milliseconds = difference % 1000;
            const tenths = Math.floor(milliseconds / 100);

            // Format as DD:HH:MM:SS.T
            const formattedTime = 
                String(days).padStart(2, '0') + ':' +
                String(hours).padStart(2, '0') + ':' +
                String(minutes).padStart(2, '0') + ':' +
                String(seconds).padStart(2, '0') + '.' +
                tenths;

            document.getElementById('timer').textContent = formattedTime;
        }

        // Update every 100 milliseconds for smooth tenths display
        setInterval(updateTimer, 100);
        
        // Initial call
        updateTimer();
    </script>
</body>
</html>
